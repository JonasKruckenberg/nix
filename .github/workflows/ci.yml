name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every configuration is a check on its own system (modules/ci.nix). The darwin
          # runner builds its hosts outright; they are small and fully cached.
          - name: darwin
            runner: macos-15
            args: ""
          # ardmore's toplevel needs the Asahi kernel, which no binary cache carries for this
          # nixpkgs pin, so the Linux runner only evaluates. ardmore builds it itself on pull
          # and keeps the old generation if that fails.
          - name: linux
            runner: ubuntu-24.04-arm
            args: --no-build
    # Stable job names: branch protection on main requires `darwin` and `linux`.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            # Runner IPs share GitHub's anonymous API rate limit; authenticate flake-input fetches.
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check -L ${{ matrix.args }}
