name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every configuration is a check on its own system (modules/ci.nix). The darwin
          # runner builds its hosts outright; they are small and fully cached.
          - name: darwin
            runner: macos-15
            args: ""
          # ardmore's toplevel needs the Asahi kernel, which no binary cache carries for this
          # nixpkgs pin, so the Linux runner only evaluates. ardmore builds it itself on pull
          # and keeps the old generation if that fails.
          - name: linux
            runner: ubuntu-24.04-arm
            args: --no-build
    # Stable job names: branch protection on main requires `darwin` and `linux`.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # The linux job also builds refractory from source (no binary cache has it).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            # Runner IPs share GitHub's anonymous API rate limit; authenticate flake-input fetches.
            # refractory is private: FLAKE_INPUTS_TOKEN reads it (and every public repo).
            access-tokens = github.com=${{ secrets.FLAKE_INPUTS_TOKEN || secrets.GITHUB_TOKEN }}
      - run: nix flake check -L ${{ matrix.args }}
      # ardmore is only evaluated above; its refractory is built here, so a refractory that fails to
      # build stops the merge instead of reaching the host (modules/server/refractory.nix).
      - if: matrix.name == 'linux'
        run: nix build -L --no-link .#refractory
