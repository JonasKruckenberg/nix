name: Deploy ardmore
permissions:
  id-token: write # This is required for the Tailscale action to request a JWT from GitHub
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            # PAT (repo contents:read) so the runner can fetch the private bulletin
            # flake input while evaluating .#ardmore (build itself runs on ardmore).
            access-tokens = github.com=${{ secrets.BULLETIN_TOKEN }}
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      # Authentication is handled by Tailscale identity — no SSH key needed.
      # Using ~/.ssh/config rather than NIX_SSHOPTS avoids a known bug
      # where NIX_SSHOPTS is not forwarded to internal nix-build SSH calls.
      - name: Configure SSH
        run: |
          install -dm 700 ~/.ssh
          {
            echo 'Host ardmore'
            echo '  User deploy'
            echo '  StrictHostKeyChecking yes'
            echo '  ServerAliveInterval 30'
            echo '  ServerAliveCountMax 5'
          } >> ~/.ssh/config
      # Ephemeral Tailscale node for this job.
      # Requires a Tailscale OAuth client with the writable auth_keys scope,
      # owned by tag:ci. The tailnet ACL must grant tag:ci SSH access to
      # ardmore as the deploy user:
      #   "ssh": [{"action":"accept","src":["tag:ci"],"dst":["tag:server"],"users":["deploy"]}]
      # ping: blocks until ardmore is reachable before continuing.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          statedir: /tmp/tailscale-state/
          ping: ardmore
      # Populate known_hosts by scanning ardmore inside the WireGuard tunnel.
      # This is MITM-safe: MagicDNS resolves 'ardmore' via Tailscale's
      # coordination server, which cryptographically binds the name to
      # ardmore's Tailscale identity. No stored secret needed.
      - name: Populate known_hosts
        run: ssh-keyscan -t ed25519 ardmore >> ~/.ssh/known_hosts
      # nixos-rebuild isn't on this Ubuntu runner, so run it from nixpkgs.
      # Build and activation happen on ardmore (aarch64) via --build-host and
      # --target-host. the runner only evaluates the flake and dispatches.
      - name: Dry-activate
        run: |
          nix run nixpkgs#nixos-rebuild -- dry-activate \
            --flake .#ardmore \
            --target-host deploy@ardmore \
            --build-host deploy@ardmore \
            --max-jobs 2 \
            --sudo
      - name: Deploy
        run: |
          nix run nixpkgs#nixos-rebuild -- switch \
            --flake .#ardmore \
            --target-host deploy@ardmore \
            --build-host deploy@ardmore \
            --max-jobs 2 \
            --sudo
