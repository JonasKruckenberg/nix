# Moves the refractory input to its `release` branch, which refractory's CI fast-forwards to each
# main commit that passed, and merges once this repository's CI passes; ardmore then pulls it with
# its next autoUpgrade. Hourly, like autoUpgrade.
#
# Secrets:
# - FLAKE_INPUTS_TOKEN: read access to refractory, which is private.
# - NIX_BOT_TOKEN: contents and pull requests read/write on this repository. Not GITHUB_TOKEN:
#   the CI runs of a pull request it opens wait for a human to approve them, and checks from a
#   workflow_dispatch run don't satisfy the ruleset's required checks.
name: update refractory
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
concurrency:
  group: update-refractory
  cancel-in-progress: false
permissions: {}
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.NIX_BOT_TOKEN }}
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.FLAKE_INPUTS_TOKEN }}
      - id: lock
        run: |
          old=$(jq -r .nodes.refractory.locked.rev flake.lock)
          nix flake update refractory
          new=$(jq -r .nodes.refractory.locked.rev flake.lock)
          {
            echo "old=$old"
            echo "new=$new"
            echo "short=${new::12}"
          } >> "$GITHUB_OUTPUT"
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.NIX_BOT_TOKEN }}
          branch: update/refractory
          delete-branch: true
          commit-message: "refractory: ${{ steps.lock.outputs.short }}"
          title: "refractory: ${{ steps.lock.outputs.short }}"
          body: |
            https://github.com/JonasKruckenberg/refractory/compare/${{ steps.lock.outputs.old }}...${{ steps.lock.outputs.new }}

            Merges itself once `darwin` and `linux` pass; ardmore applies it on its next autoUpgrade.
      # Not when the pull request was closed as no longer needed (the lock already moved).
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.NIX_BOT_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}" --repo "$GITHUB_REPOSITORY"
